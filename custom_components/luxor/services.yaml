save_to_theme:
  name: Save to theme
  description: >-
    Write a light's current brightness and colour into a Luxor theme so they persist.
    Both are otherwise temporary: a theme stores its own per-group intensity and colour and
    re-applies both whenever it runs, which on a controller with an astronomic schedule is every
    evening.
  target:
    entity:
      integration: luxor
      domain: light
  fields:
    theme_index:
      name: Theme
      description: >-
        Which theme to write to. Defaults to the theme set in the integration's options.
        Choose deliberately: the alarm themes are themes too.
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 25
          mode: box
